
name: Push Build to Artifactory

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  attestations: write
  artifact-metadata: write

env:
  JOB_NAME: "guestbook_project"
  JFrog_Project: "alexwangjp"
  JF_URL: "solenglatest.jfrog.io"
  Application_Key: "guestbook"

jobs:

  # ============================================================
  # Job 1: Build, Push Artifacts, Publish Build-Info and Collect Evidence
  # ============================================================
  build-and-evidence:
    name: Build and Collect Evidence
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Pin Maven version
      - name: Pin Maven to 3.9.11
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz \
            -o /tmp/maven.tar.gz
          sudo tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 5. Set up JFrog CLI with OIDC
      # Automatic Evidence collection is intentionally enabled.
      # It runs in the Post Job phase of this Job.
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: https://${{ env.JF_URL }}
        with:
          oidc-provider-name: liwei-github-oidc
          oidc-audience: jfrog-github

      # 6. Show tool versions
      - name: Show tool versions
        shell: bash
        run: |
          java -version
          mvn -version
          jf --version
          echo "JAVA_HOME=$JAVA_HOME"

      # 7. Build Maven project
      - name: Build Maven Project
        shell: bash
        run: |
          set -euo pipefail

          sed -i "s#BUILDNUM#${GITHUB_RUN_NUMBER}#g" \
            ./gateway-service/pom.xml

          jf mvnc \
            --repo-resolve-releases="${JFrog_Project}-mvn-virtual" \
            --repo-resolve-snapshots="${JFrog_Project}-mvn-virtual" \
            --repo-deploy-releases="${JFrog_Project}-mvn-dev-local" \
            --repo-deploy-snapshots="${JFrog_Project}-mvn-dev-local"

          jf mvn clean install \
            -f ./gateway-service/pom.xml \
            --build-name="$JOB_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project"

      # 8. Build and push Docker image
      - name: Build Docker Project and Push Docker image
        id: build-and-push
        shell: bash
        working-directory: gateway-service
        run: |
          set -euo pipefail

          IMAGE="${JF_URL}/${JFrog_Project}-docker-dev-local/gateway-service:${GITHUB_RUN_NUMBER}"

          echo "Building image: $IMAGE"

          jf docker build \
            -t "$IMAGE" \
            --metadata-file=build-metadata \
            --output=type=image \
            --push \
            . \
            --build-name="$JOB_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project"

          # Add Docker image information to Build-Info
          jf rt build-docker-create \
            "${JFrog_Project}-docker-dev-local" \
            --image-file build-metadata \
            --build-name "$JOB_NAME" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --project "$JFrog_Project"

          DIGEST=$(jq -r '.["containerimage.digest"]' build-metadata)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::Docker digest could not be extracted."
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          echo "Docker image: $IMAGE"
          echo "Docker digest: $DIGEST"

      # 9. Generate GitHub SLSA Provenance for the Docker image
      # JFrog's automatic Evidence collector processes the generated
      # attestation during this Job's Post Job phase.
      - name: Attest Docker Image with Build Provenance
        id: attest-provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: oci://${{ env.JF_URL }}/${{ env.JFrog_Project }}-docker-dev-local/gateway-service
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: false
          show-summary: true

      # 10. Prepare Helm chart
      - name: Build Helm Package
        shell: bash
        working-directory: kube-deploy/charts/guestbook
        run: |
          set -euo pipefail

          sed -i "s/podCount/2/g" values.yaml
          sed -i "s#Rigistry_URL#${JF_URL}#g" values.yaml
          sed -i "s#Docker_Repo#${JFrog_Project}-docker-dev-local#g" values.yaml
          sed -i "s/chartversion/${GITHUB_RUN_NUMBER}/g" Chart.yaml
          sed -i "s/Gateway_Repo_Name/gateway-service/g" values.yaml
          sed -i "s/gateway_version/${GITHUB_RUN_NUMBER}/g" values.yaml
          sed -i "s/Discovery_Repo_Name/discovery-service/g" values.yaml
          sed -i "s/discovery_version/${GITHUB_RUN_NUMBER}/g" values.yaml

      # 11. Publish Helm chart
      - name: Publish Helm Package
        shell: bash
        working-directory: kube-deploy/charts
        run: |
          set -euo pipefail

          helm package guestbook

          jf rt upload \
            "guestbook-${GITHUB_RUN_NUMBER}.tgz" \
            "${JFrog_Project}-helm-dev-local/guestbook/${GITHUB_RUN_NUMBER}/" \
            --build-name="$JOB_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project"

      # 12. Upload documentation
      - name: Upload Docs
        shell: bash
        run: |
          set -euo pipefail

          DOC_FILE="Doc-${GITHUB_RUN_NUMBER}.txt"
          echo "$GITHUB_RUN_NUMBER" > "$DOC_FILE"

          jf rt upload \
            "$DOC_FILE" \
            "${JFrog_Project}-generic-dev-local/${GITHUB_RUN_NUMBER}/" \
            --build-name="$JOB_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project"

      # 13. Publish Build-Info and environment/VCS metadata
      - name: Publish Build-Info to Artifactory
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.repositoryUrl }}
          REF_NAME: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          EVENT_URL: ${{ github.event.repository.html_url }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_OWNER: ${{ github.repository_owner }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          repository_url="${REPOSITORY_URL:-empty}"
          ref_name="${REF_NAME:-empty}"
          commit_sha="${COMMIT_SHA:-empty}"
          commit_message="${COMMIT_MESSAGE:-empty}"
          commit_author="${COMMIT_AUTHOR:-empty}"
          event_url="${EVENT_URL:-empty}"
          event_name="${EVENT_NAME:-empty}"
          git_owner="${GIT_OWNER:-empty}"
          head_ref="${HEAD_REF:-empty}"
          base_ref="${BASE_REF:-empty}"

          # Collect environment and Git metadata
          jf rt build-collect-env \
            "$JOB_NAME" "$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project"

          jf rt build-add-git \
            "$JOB_NAME" "$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project"

          # Publish Build-Info
          jf rt build-publish \
            "$JOB_NAME" "$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project"

          # Attach additional Build-Info properties
          jf rt build-promote-properties \
            --build-name="$JOB_NAME" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --project="$JFrog_Project" || true

          jf rt build-set-props \
            --build="${JOB_NAME}/${GITHUB_RUN_NUMBER}" \
            "repository_url=${repository_url};ref_name=${ref_name};commit_sha=${commit_sha};commit_message=${commit_message};commit_author=${commit_author};event_url=${event_url};event_name=${event_name};git_owner=${git_owner};head_ref=${head_ref};base_ref=${base_ref}" \
            --project="$JFrog_Project" || true

          {
            echo "### Commit message:"
            echo
            echo "$commit_message"
            echo
            echo "### JIRA URL:"
            echo
            first_field=$(printf '%s\n' "$commit_message" | awk '{print $1}')
            echo "https://yourcompany.atlassian.net/browse/${first_field}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # 14. Summarize artifact locations
      - name: Echo Artifacts Info
        shell: bash
        run: |
          set -euo pipefail

          jar_url="${{ vars.ARTIFACTORY_URL }}/artifactory/${JFrog_Project}-mvn-dev-local/org/liwei/guestbook-microservices-k8s/gateway-service/1.0.${GITHUB_RUN_NUMBER}/gateway-service-1.0.${GITHUB_RUN_NUMBER}.jar"

          docker_url="${{ vars.ARTIFACTORY_URL }}/${JFrog_Project}-docker-dev-local/gateway-service:${GITHUB_RUN_NUMBER}"

          helm_chart_url="${{ vars.ARTIFACTORY_URL }}/artifactory/${JFrog_Project}-helm-dev-local/guestbook/${GITHUB_RUN_NUMBER}/guestbook-${GITHUB_RUN_NUMBER}.tgz"

          docs_url="${{ vars.ARTIFACTORY_URL }}/artifactory/${JFrog_Project}-generic-dev-local/${GITHUB_RUN_NUMBER}/Doc-${GITHUB_RUN_NUMBER}.txt"

          {
            echo "### Artifacts Information"
            echo
            echo "**Jar packages:**"
            echo "[$jar_url]($jar_url)"
            echo
            echo "**Docker images:**"
            echo "[$docker_url]($docker_url)"
            echo
            echo "**Helm charts:**"
            echo "[$helm_chart_url]($helm_chart_url)"
            echo
            echo "**Docs:**"
            echo "[$docs_url]($docs_url)"
          } >> "$GITHUB_STEP_SUMMARY"

    # IMPORTANT:
    # The JFrog setup action's Post Job phase runs after all steps above.
    # The next Job waits for this Job to finish.

  # ============================================================
  # Job 2: Create AppTrust Application Version
  # ============================================================
  create-application:
    name: Create AppTrust Application Version
    runs-on: ubuntu-latest

    # Wait for Job 1, including its Post Job cleanup/evidence collection.
    needs: build-and-evidence

    # This Job only creates the AppTrust version.
    # It does not need to publish Build-Info or collect attestations again.
    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: https://${{ env.JF_URL }}
        with:
          oidc-provider-name: liwei-github-oidc
          oidc-audience: jfrog-github
          disable-auto-build-publish: true
          disable-auto-evidence-collection: true

      - name: Verify JFrog Connection
        shell: bash
        run: |
          set -euo pipefail
          jf rt ping

      - name: Create AppTrust Application Version
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "Creating AppTrust Application Version"
          echo "============================================"

          echo "Application : $Application_Key"
          echo "Version     : $GITHUB_RUN_NUMBER"
          echo "Build       : $JOB_NAME"
          echo "Build ID    : $GITHUB_RUN_NUMBER"
          echo "Project     : $JFrog_Project"

          jf apptrust version-create \
            "$Application_Key" \
            "$GITHUB_RUN_NUMBER" \
            --source-type-builds \
            "name=$JOB_NAME, id=$GITHUB_RUN_NUMBER, repo-key=${JFrog_Project}-build-info"
